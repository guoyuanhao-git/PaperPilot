<main>
<header><div class="catalog-actions"><button id="refresh-catalog" class="text-button">核查官网</button><button id="about" class="text-button">来源与更新 ↗</button></div></header>
<section id="spotlight" class="spotlight" aria-label="重点会议"></section>
<section class="board" aria-label="会议总览"><div class="board-top"><div><h2>会议总览 <span id="count"></span></h2></div><div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索会议或方向" aria-label="搜索会议"></label><select id="zone" aria-label="时间显示"><option value="Asia/Shanghai">北京时间</option><option value="official">官方时区</option><option value="UTC">UTC</option></select></div></div>
<div class="filter-row"><div class="filters" id="filters" aria-label="研究方向"><button data-filter="全部" class="selected" aria-pressed="true">全部</button><button data-filter="机器人" aria-pressed="false">机器人</button><button data-filter="学习与决策" aria-pressed="false">学习与决策</button><button data-filter="视觉与多模态" aria-pressed="false">视觉与多模态</button></div><label class="hide-past" title="摘要注册截止的会议也会收起；已注册作者仍可继续提交全文。"><input type="checkbox" id="hide-past"> 收起已截止会议</label></div>
<div id="cards" class="cards"></div><p class="empty" id="empty" hidden>没有匹配的会议，试试其他关键词或筛选条件。</p></section>
<footer><span id="update-status" role="status">正在读取最新会议数据…</span></footer>
</main><dialog id="details" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button class="close" aria-label="关闭">×</button></div><div id="detail-body"></div></dialog>
<dialog id="about-dialog" aria-labelledby="about-title"><div class="dialog-head"><h2 id="about-title">来源与更新</h2><button class="close" aria-label="关闭">×</button></div><div class="catalog-actions"><label class="text-button">导入会议目录<input id="catalog-upload" type="file" accept=".json,application/json"></label></div><p id="catalog-error" role="alert"></p><label class="auto-setting"><input type="checkbox" id="auto-check" title="使用当前模型核查官网；应用关闭时，下次启动补查"> 自动核查 <span id="schedule-status"></span></label><div id="update-history"></div></dialog><div id="toast" role="status"></div>
<dialog id="check-confirm" aria-labelledby="check-title"><div class="dialog-head"><h2 id="check-title">核查会议官网</h2><button class="close" aria-label="关闭">×</button></div><p>读取 13 个会议的官方公告，由当前模型核对日期。需要一些时间，并会消耗模型用量。</p><div class="catalog-actions"><button id="check-cancel" class="text-button">取消</button><button id="check-start" class="text-button">开始核查</button></div></dialog>
